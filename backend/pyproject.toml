[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowflow-ai"
version = "0.8.0"
description = "KnowFlow AI backend and Linux Agent CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "KnowFlow AI contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jsonschema==4.23.0",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.0",
  "prompt-toolkit==3.0.53",
  "pydantic==2.13.4",
  "requests==2.32.3",
  "rich==15.0.0",
  "textual==8.2.8",
  "tomli==2.2.1; python_version < '3.11'",
  "typer==0.27.1",
]

[project.optional-dependencies]
local = [
  "beautifulsoup4==4.12.3",
  "chromadb==0.5.23",
  "cryptography==44.0.0",
  "fastapi==0.115.6",
  "langchain-core==1.5.3",
  "langchain-text-splitters==1.1.2",
  "langgraph==1.2.10",
  "langgraph-checkpoint-sqlite==3.1.0",
  "mcp==1.28.1",
  "mem0ai==2.0.14",
  "openpyxl==3.1.5",
  "pydantic==2.13.4",
  "pymysql==1.1.1",
  "pypdf==5.1.0",
  "python-docx==1.1.2",
  "python-dotenv==1.0.1",
  "python-multipart==0.0.20",
  "python-pptx==1.0.2",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.urls]
Homepage = "https://github.com/cs-xdu-dev-001/KnowFlow-AI"
Documentation = "https://github.com/cs-xdu-dev-001/KnowFlow-AI#readme"
Issues = "https://github.com/cs-xdu-dev-001/KnowFlow-AI/issues"
Source = "https://github.com/cs-xdu-dev-001/KnowFlow-AI"

[project.scripts]
knowflow = "knowflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowflow*"]

[tool.setuptools.package-data]
knowflow = ["builtin_skills/**", "tui/*.tcss"]
