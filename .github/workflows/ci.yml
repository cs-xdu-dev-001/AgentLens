name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    name: Build and checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            cli-tui/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install build
          python -m pip install -r backend/requirements.txt
          python -m pip install --no-deps -e backend

      - name: Check CLI entry point
        shell: pwsh
        run: |
          agentlens --help
          knowflow --help

      - name: Build and test Ink CLI
        working-directory: cli-tui
        shell: pwsh
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code ../backend/knowflow/ink_tui/index.mjs ../backend/knowflow/ink_tui/THIRD_PARTY_LICENSES.txt

      - name: Build and smoke-test CLI package
        shell: bash
        run: |
          set -euo pipefail
          python -m build backend
          cli_venv="${RUNNER_TEMP}/agentlens-cli-smoke"
          python -m venv "${cli_venv}"
          "${cli_venv}/bin/python" -m pip install --disable-pip-version-check backend/dist/*.whl
          "${cli_venv}/bin/agentlens" --help >/dev/null
          "${cli_venv}/bin/knowflow" --help >/dev/null
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')"
          test "$("${cli_venv}/bin/agentlens" --version)" = "${package_version}"
          test "$("${cli_venv}/bin/knowflow" --version)" = "${package_version}"
          "${cli_venv}/bin/python" - <<'PY'
          import sys
          import knowflow.cli

          heavy = {"fastapi", "mem0", "chromadb"}
          imported = heavy.intersection(sys.modules)
          assert not imported, f"remote CLI imported local runtime dependencies: {sorted(imported)}"
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: npm run build

      - name: Test frontend
        working-directory: frontend
        shell: pwsh
        run: npm test

      - name: Run project checks
        shell: pwsh
        run: |
          $failed = @()
          Get-ChildItem -Path tests -Filter 'check_*.py' | Sort-Object Name | ForEach-Object {
            Write-Host "== $($_.Name) =="
            python $_.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $_.Name }
          }
          if ($failed.Count) {
            Write-Host "FAILED: $($failed -join ', ')"
            exit 1
          }
          Write-Host 'ALL CHECKS PASSED'

      - name: Validate fast deployment script
        shell: bash
        run: |
          bash -n deploy/fast-deploy.sh
          sh -n install.sh

      - name: Build Linux deployment bundle
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/agentlens-linux"
          archive="agentlens-linux-${GITHUB_SHA}.tar.gz"
          mkdir -p "${bundle}/frontend"
          git archive --format=tar "${GITHUB_SHA}" backend deploy README.md README_EN.md \
            | tar -xf - -C "${bundle}"
          cp -a frontend/dist "${bundle}/frontend/dist"
          python - "${bundle}/DEPLOYMENT-MANIFEST.json" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          path = sys.argv[1]
          payload = {
              "commit": os.environ["GITHUB_SHA"],
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "platform": "linux",
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY
          tar -C "${bundle}" -czf "${archive}" .
          tar -tzf "${archive}" > bundle-contents.txt
          grep -q '^./backend/knowflow/' bundle-contents.txt
          grep -q '^./frontend/dist/index.html$' bundle-contents.txt
          if grep -E '(^|/)\.env$|(^|/)data/|(^|/)node_modules/' bundle-contents.txt; then
            echo 'Deployment bundle contains forbidden runtime or secret paths.' >&2
            exit 1
          fi
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Upload Linux deployment bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agentlens-linux-${{ github.sha }}
          path: |
            agentlens-linux-${{ github.sha }}.tar.gz
            agentlens-linux-${{ github.sha }}.tar.gz.sha256
            bundle-contents.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
