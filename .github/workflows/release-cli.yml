name: Release CLI

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cli-tui/package-lock.json

      - name: Build and test Ink CLI
        working-directory: cli-tui
        run: |
          npm ci
          npm test
          npm run build
          git diff --exit-code ../backend/knowflow/ink_tui/index.mjs ../backend/knowflow/ink_tui/THIRD_PARTY_LICENSES.txt

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"

      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check "build==1.4.0" "twine==6.2.0"
          python -m build backend
          python -m twine check backend/dist/*

      - name: Smoke-test wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "${RUNNER_TEMP}/knowflow-cli-release"
          "${RUNNER_TEMP}/knowflow-cli-release/bin/python" -m pip install backend/dist/*.whl
          "${RUNNER_TEMP}/knowflow-cli-release/bin/knowflow" --help >/dev/null
          test "$("${RUNNER_TEMP}/knowflow-cli-release/bin/knowflow" --version)" = "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" backend/dist/* --generate-notes --verify-tag

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
        with:
          packages-dir: backend/dist/
