<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>AgentLens</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fbfbf9;
        color: #171717;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(480px, 100%);
        display: grid;
        gap: 18px;
        padding: 28px;
        border: 1px solid #d9d9d2;
        border-radius: 16px;
        background: #ffffff;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .brand strong {
        font-size: 18px;
        letter-spacing: -0.02em;
      }

      h1 {
        margin: 0;
        font-size: 18px;
        line-height: 1.4;
      }

      p {
        margin: 0;
        color: inherit;
        font-size: 16px;
        line-height: 1.6;
      }

      code {
        display: block;
        overflow-x: auto;
        padding: 10px 12px;
        border: 1px solid #e2e2dc;
        border-radius: 9px;
        color: #30302c;
        background: #f5f5f2;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root { background: #111213; color: #f5f5f2; }
        main { border-color: rgba(255, 255, 255, 0.14); background: #171819; }
        code { border-color: rgba(255, 255, 255, 0.12); color: #e8e8e2; background: #111213; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/favicon.svg" alt="" />
        <strong>AgentLens</strong>
      </div>
      <h1>Frontend is not built yet</h1>
      <p>Local preview</p>
      <code>cd frontend && npm run dev</code>
      <p>Production build</p>
      <code>cd frontend && npm run build</code>
    </main>
  </body>
</html>
